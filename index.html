<!DOCTYPE html>
<html lang="de">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Valentinstag ❤️</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@600&display=swap" rel="stylesheet">
    <style>
        /* Allgemeine Stile */
        body {
            background-color: #fef2f7; /* Helles Rosa für den Hintergrund */
            color: #333; /* Dunkelgrauer Text */
            font-family: 'Poppins', sans-serif; /* Neue Schriftart */
            margin: 0;
            padding: 0;
        }

        header {
            background-color: #ff69b4; /* Helles Pink für den Header */
            padding: 20px;
            color: white;
        }

        h1, h2 {
            text-align: center; /* Zentrierte Überschriften */
        }

        h1 {
            font-size: 2.5rem;
            margin: 0;
        }

        h2 {
            font-size: 2rem;
            color: #ff69b4; /* Pink für h2 */
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2rem;
            margin: 10px 0;
            text-align: center; /* Zentrierter Text für das <p> */
        }

        /* Abschnitt "Essen gehen" */
        .question {
            text-align: center;
            margin-top: 40px;
        }

        /* Button Container für Bilder */
        .button-container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 20px;
        }

        /* Bilder (die als Buttons dienen) */
        .button-container a img {
            width: 200px; /* Größe der Bilder */
            height: 200px;
            border-radius: 10px; /* Abgerundete Ecken */
            cursor: pointer;
            transition: transform 0.3s ease;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1); /* Sanfter Schatten */
        }

        .button-container a img:hover {
            transform: scale(1.1); /* Zoom-Effekt */
        }

        /* Footer */
        footer {
            background-color: #ff69b4; /* Pink */
            color: white;
            padding: 15px;
            text-align: center;
            margin-top: 40px;
        }
    </style>
</head>
<body>
    <header>
        <h1>❤️ Frohen Valentinstag, Baby! 💕</h1>
        <p>Ich liebe dich! 💖</p>
    </header>

    <section class="question">
        <h2>Wo willst du essen gehen? 🍴</h2>
        <div class="button-container">
            <a href="https://maps.app.goo.gl/Vtfk9SV2DmofPmCa6?g_st=com.google.maps.preview.copy" target="_blank">
                <img src="restaurant1.jpg" alt="Restaurant 1">
            </a>
            <a href="https://maps.app.goo.gl/6kyVx9XRDYZF3miK8?g_st=com.google.maps.preview.copy" target="_blank">
                <img src="restaurant2.jpg" alt="Restaurant 2">
            </a>
        </div>
    </section>

    <footer>
        <p>Frohen Valentinstag und viel Spaß beim Essen! 💖</p>
    </footer>
</body>
</html>
